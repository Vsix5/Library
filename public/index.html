<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page - Bookstore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="logo">Logo</div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="add-book.html">Add Your Book</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <a href="signup.html">Sign Up / Login</a>
            <a href="#" class="cart-btn">Cart</a>
        </div>
    </header>

    <main>
        <!-- Search Bar -->
        <section class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Search for a Book">
                <button type="button">Search</button>
            </div>
        </section>

        <!-- Book Categories Carousel -->
        <section class="carousel-section">
            <h2 class="section-title">Book Categories</h2>
            <div class="carousel-container">
                <button class="carousel-btn">&lt;</button>
                <div class="carousel-track">
                    <div class="carousel-card">Category 1</div>
                    <div class="carousel-card">Category 2</div>
                    <div class="carousel-card">Category 3</div>
                </div>
                <button class="carousel-btn">&gt;</button>
            </div>
        </section>

        <!-- Top Sellers Section (4x2 Grid) -->
        <section>
            <h2 class="section-title">TOP SELLERS</h2>
            <div class="product-grid grid-4x2">
                <!-- Row 1 -->
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 1</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 2</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 3</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 4</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <!-- Row 2 -->
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 5</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 6</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 7</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-image-placeholder">Pro 8</div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </section>

        <!-- Subscribe Section -->
        <section class="subscribe-section">
            <h3>Subscribe to our Newsletter</h3>
            <div class="subscribe-box">
                <input type="email" placeholder="Enter your email">
                <button type="button">Subscribe</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="logo">Footer Logo</div>
        <ul class="footer-menu">
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>

</body>
</html>
