<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Your Book - Bookstore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Logo</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="add-book.html" class="active">Add Your Book</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <a href="signup.html">Sign Up / Login</a>
            <a href="#" class="cart-btn">Cart</a>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 class="form-title">ADD A BOOK</h2>
            <form id="add-book-form" method="POST">
                
                <div class="form-group">
                    <label for="title">Book Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author <span class="required">*</span></label>
                    <input type="text" id="author" name="author" required>
                </div>

                <div class="form-group">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="fiction">Fiction</option>
                        <option value="non-fiction">Non-Fiction</option>
                        <option value="sci-fi">Sci-Fi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN <span class="required">*</span></label>
                    <input type="text" id="isbn" name="isbn" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="pages">Number of Pages</label>
                    <input type="number" id="pages" name="pages">
                </div>

                <div class="form-group">
                    <label for="price">Price <span class="required">*</span></label>
                    <input type="number" step="0.01" id="price" name="price" required>
                </div>

                <div class="form-group">
                    <label for="status">Reading Status</label>
                    <select id="status" name="status">
                        <option value="want-to-read">Want to Read</option>
                        <option value="reading">Currently Reading</option>
                        <option value="read">Finished Reading</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">ADD A BOOK</button>
                <br>
                <p id="form-message"></p>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="logo">Footer Logo</div>
        <ul class="footer-menu">
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>
<script src="add-book.js"></script>
</body>
</html>
