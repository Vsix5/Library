<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Catalog - Bookstore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Logo</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html" class="active">Books</a></li>
                <li><a href="add-book.html">Add Your Book</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <a href="signup.html">Sign Up / Login</a>
            <a href="#" class="cart-btn">Cart</a>
        </div>
    </header>

    <main>
        <!-- Search Bar -->
        <section class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Search for a Book">
                <button type="button">Search</button>
            </div>
        </section>

        <!-- Catalog Layout with Sidebar Filter -->
        <div class="catalog-layout">
            <aside class="filter-sidebar">
                <h3>Filter</h3>
                <div class="filter-group">
                    <p><strong>Categories</strong></p>
                    <label><input type="checkbox"> Fiction</label><br>
                    <label><input type="checkbox"> Non-Fiction</label><br>
                    <label><input type="checkbox"> Sci-Fi</label><br>
                    <label><input type="checkbox"> History</label>
                </div>
            </aside>

            <section class="catalog-content">
                <h2 class="section-title">ALL BOOKS</h2>
                
                <!-- 20 Book Grid (4 Columns x 5 Rows) -->
                <div class="product-grid grid-4x5">
                    <div class="product-card"><div class="product-image-placeholder">1</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">2</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">3</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">4</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">5</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">6</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">7</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">8</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">9</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">10</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">11</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">12</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">13</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">14</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">15</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">16</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">17</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">18</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">19</div><button class="add-to-cart-btn">Add to Cart</button></div>
                    <div class="product-card"><div class="product-image-placeholder">20</div><button class="add-to-cart-btn">Add to Cart</button></div>
                </div>

                <!-- Pagination -->
                <div class="pagination">
                    <button>&laquo; Prev</button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>Next &raquo;</button>
                </div>
            </section>
        </div>

        <!-- Subscribe Section -->
        <section class="subscribe-section">
            <h3>Subscribe to our Newsletter</h3>
            <div class="subscribe-box">
                <input type="email" placeholder="Enter your email">
                <button type="button">Subscribe</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="logo">Footer Logo</div>
        <ul class="footer-menu">
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>

</body>
</html>
